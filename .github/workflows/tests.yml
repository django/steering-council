name: Tests

on:
  pull_request:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repo
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: uv run pytest
      - run: uv run python manage.py distill generate --output-directory _site --collectstatic --force

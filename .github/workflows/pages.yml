name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repo
      pages: read # configure-pages reads the Pages site settings
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false # no cache in a publishing workflow (cache poisoning)
      - run: uv run pytest
      - run: uv run python manage.py distill generate --output-directory _site --collectstatic --force
      - name: Accessibility scan of the built site
        uses: Community-Access/accessibility-agents/action@v6.0.0
        with:
          scan-type: web
          paths: _site/steering-council
          fail-on: serious
          upload-sarif: false # report as annotations; no security-events permission
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site/steering-council

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages authenticates with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

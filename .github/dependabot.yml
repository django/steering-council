version: 2
multi-ecosystem-groups:
  all:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    multi-ecosystem-group: all
    patterns: ["*"]
    cooldown:
      default-days: 7
